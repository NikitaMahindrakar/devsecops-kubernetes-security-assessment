# This deployment has plaintext secrets in env vars - SHOULD BE REJECTED
# Tests Kyverno policy for secrets in environment variables
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-exposure-test
  namespace: ledger
  labels:
    app: secret-exposure
    purpose: kyverno-rejection-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-exposure
  template:
    metadata:
      labels:
        app: secret-exposure
    spec:
      containers:
      - name: app
        image: nginx:1.25.0
        env:
        - name: DB_PASSWORD        # ❌ Plaintext secret in env
          value: "supersecret123"
        - name: API_KEY            # ❌ Plaintext API key
          value: "sk-abc123xyz"
        - name: JWT_SECRET         # ❌ Plaintext JWT secret
          value: "my-jwt-secret"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
