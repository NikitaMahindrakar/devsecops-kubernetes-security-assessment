name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ledger-api

    steps:
      # ------------------------------
      # Checkout Repository
      # ------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------
      # Convert GHCR image to lowercase
      # ------------------------------
      - name: Set Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/${IMAGE_NAME}" >> $GITHUB_ENV

      # ------------------------------
      # Scan Secrets
      # ------------------------------
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------
      # SAST Scan
      # ------------------------------
      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      # ------------------------------
      # Build Docker Image
      # ------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest .

      # ------------------------------
      # Scan Docker Image
      # ------------------------------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      # ------------------------------
      # Upload SARIF
      # ------------------------------
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # ------------------------------
      # Login to GHCR
      # ------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------
      # Push Images
      # ------------------------------
      - name: Push Docker Images
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # ------------------------------
      # Install Cosign
      # ------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # ------------------------------
      # Sign Image
      # ------------------------------
      - name: Sign Docker Image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes $IMAGE:${{ github.sha }}

      # ------------------------------
      # Create SLSA Predicate
      # ------------------------------
      - name: Create Predicate
        run: |
          cat <<EOF > predicate.json
          {
            "buildType": "https://github.com/Attestations/GitHubActions@v1",
            "builder": {
              "id": "${{ github.run_id }}"
            }
          }
          EOF

      # ------------------------------
      # Generate Attestation
      # ------------------------------
      - name: Generate SLSA Attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest \
            --yes \
            --predicate predicate.json \
            --type slsaprovenance \
            $IMAGE:${{ github.sha }}

      # ------------------------------
      # Success Message
      # ------------------------------
      - name: Pipeline Completed
        run: |
          echo "====================================="
          echo "Build Successful"
          echo "Image: $IMAGE:${{ github.sha }}"
          echo "Scans Passed"
          echo "Image Signed"
          echo "SLSA Attestation Generated"
          echo "====================================="