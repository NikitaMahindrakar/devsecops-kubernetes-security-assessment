name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  IMAGE_NAME: ledger-api

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Create lowercase GHCR image name
      - name: Set Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/${IMAGE_NAME}" >> $GITHUB_ENV

      ####################################################
      # Gitleaks
      ####################################################
      - name: Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ####################################################
      # Semgrep
      ####################################################
      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      ####################################################
      # Build Docker Image
      ####################################################
      - name: Build Docker Image
        run: |
          docker build \
          -t $IMAGE:${{ github.sha }} \
          -t $IMAGE:latest .

      ####################################################
      # Trivy Filesystem Scan
      ####################################################
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      ####################################################
      # Trivy Image Scan
      ####################################################
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      ####################################################
      # Upload SARIF
      ####################################################
      - name: Upload Trivy Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      ####################################################
      # Login GHCR
      ####################################################
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ####################################################
      # Push Image
      ####################################################
      - name: Push Docker Images
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      ####################################################
      # Install Cosign
      ####################################################
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      ####################################################
      # Sign Image
      ####################################################
      - name: Cosign Sign
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes $IMAGE:${{ github.sha }}

      ####################################################
      # Create Predicate
      ####################################################
      - name: Create SLSA Predicate
        run: |
          cat > predicate.json <<EOF
          {
            "buildType":"https://github.com/Attestations/GitHubActions",
            "builder":{
              "id":"${{ github.run_id }}"
            }
          }
          EOF

      ####################################################
      # Generate Attestation
      ####################################################
      - name: Generate SLSA Attestation
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest \
            --yes \
            --predicate predicate.json \
            --type slsaprovenance \
            $IMAGE:${{ github.sha }}

      ####################################################
      # Summary
      ####################################################
      - name: Pipeline Summary
        run: |
          echo "========================================"
          echo "Security Pipeline Completed"
          echo "Image : $IMAGE:${{ github.sha }}"
          echo "Secrets Scan : Passed"
          echo "SAST : Passed"
          echo "Trivy : Passed"
          echo "Cosign : Signed"
          echo "SLSA : Generated"
          echo "========================================"